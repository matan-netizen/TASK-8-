name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx next typegen && npm run typecheck
      - name: Unit and workflow tests
        run: npm test
      - name: AI behaviour eval (demo mode)
        run: npm run eval
      - name: Build
        run: npm run build
